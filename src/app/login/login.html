<div class="login-container">

    <div class="login-card">

        <div class="login-header">
            <div class="login-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="40" height="40" fill="white">
                    <path d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512l388.6 0c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304l-91.4 0z"/>
                </svg>
            </div>
            <h1>INICIAR SESIÓN</h1>
            <p class="subtitle">Sistema de Facturación</p>
        </div>

        <hr class="divider">

        <div class="login-form">
            <div class="input-group">
                <label for="input-usuario">USUARIO</label>
                <input
                    id="input-usuario"
                    type="text"
                    placeholder="Ingrese su usuario"
                    [(ngModel)]="usuario"
                    (keyup.enter)="iniciarSesion()"
                >
            </div>

            <div class="input-group">
                <label for="input-contrasena">CONTRASEÑA</label>
                <input
                    id="input-contrasena"
                    type="password"
                    placeholder="Ingrese su contraseña"
                    [(ngModel)]="contrasena"
                    (keyup.enter)="iniciarSesion()"
                >
            </div>

            <!-- Mensaje de error -->
            <div class="error-message" *ngIf="errorMessage && !cargando">
                <span class="error-icon">⊘</span>
                {{ errorMessage }}
            </div>

            <button class="btn-login" (click)="iniciarSesion()" [disabled]="cargando">
                <span *ngIf="!cargando">INGRESAR</span>
                <span *ngIf="cargando">Verificando...</span>
            </button>
        </div>

    </div>

</div>
